<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101C35">
  <title>Offline — HireFit</title>
  <style>
    :root {
      --primary: #101C35;
      --secondary: #2878F0;
      --accent: #53E0B0;
      --bg: #0A1222;
      --surface: #131E35;
      --border: rgba(255, 255, 255, 0.1);
      --text: #FFFFFF;
      --text-muted: #94A3B8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .offline-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      animation: fadeIn 0.4s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .logo {
      width: 72px;
      height: 72px;
      margin-bottom: 1.25rem;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.05);
      padding: 6px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      background: rgba(239, 68, 68, 0.15);
      color: #F87171;
      font-size: 0.8125rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }
    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #EF4444;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: #FFFFFF;
    }
    p {
      font-size: 0.9375rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 1.75rem;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .btn-primary {
      background: var(--secondary);
      color: #FFFFFF;
      border: none;
      padding: 0.875rem 1.25rem;
      border-radius: 10px;
      font-size: 0.9375rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary:hover {
      background: #1A66DC;
    }
    .btn-secondary {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 0.75rem 1.25rem;
      border-radius: 10px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-secondary:hover {
      color: #FFFFFF;
      border-color: rgba(255, 255, 255, 0.25);
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <img src="/pwa-192x192.png" alt="HireFit" class="logo" />
    <div class="badge">
      <span class="badge-dot"></span>
      Offline Mode
    </div>
    <h1>No Internet Connection</h1>
    <p>HireFit requires an internet connection to optimize CVs and sync real-time job openings. Please check your network and reconnect.</p>
    <div class="actions">
      <button class="btn-primary" onclick="window.location.reload()">Retry Connection</button>
      <button class="btn-secondary" onclick="window.history.back()">Go Back</button>
    </div>
  </div>

  <script>
    // Auto-reload when connection is restored
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
